# Publica o pacote DanfeSharp.Next ao enviar uma tag de versão (ex.: git tag v3.2.1 && git push origin v3.2.1).
# O pacote vai para o nuget.org e para o GitHub Packages e fica anexado a uma Release do repositório.
# O nuget.org usa Trusted Publishing: a política do usuário allanlinux autoriza este workflow, sem API key guardada.
name: Publicar pacote

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publicar:
    # Windows: tem a Times New Roman usada nos testes e roda os dois frameworks (net462 e net8.0).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Versão a partir da tag
        shell: bash
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Compilar
        run: dotnet build DanfeSharp.sln -c Release -p:Version=${{ env.VERSAO }}

      - name: Testar
        run: dotnet test DanfeSharp.Test/DanfeSharp.Test.csproj -c Release --no-build

      - name: Gerar pacote
        run: dotnet pack DanfeSharp/DanfeSharp.csproj -c Release --no-build -p:Version=${{ env.VERSAO }} -o nupkgs

      - name: Criar Release com o pacote
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" nupkgs/*.nupkg --title "DanfeSharp.Next $VERSAO" --generate-notes

      - name: Publicar no GitHub Packages
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
          dotnet nuget push nupkgs/*.nupkg --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Login no nuget.org (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: allanlinux

      - name: Publicar no nuget.org
        shell: bash
        run: dotnet nuget push nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate
