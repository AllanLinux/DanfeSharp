# Publica o pacote DanfeSharp.Next ao enviar uma tag de versão (ex.: git tag v3.1.1 && git push origin v3.1.1).
# O pacote vai para o GitHub Packages e fica anexado a uma Release do repositório.
name: Publicar pacote

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publicar:
    # Windows: tem a Times New Roman usada nos testes e roda os dois frameworks (net462 e net8.0).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão a partir da tag
        shell: bash
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Compilar
        run: dotnet build DanfeSharp.sln -c Release -p:Version=${{ env.VERSAO }}

      - name: Testar
        run: dotnet test DanfeSharp.Test/DanfeSharp.Test.csproj -c Release --no-build

      - name: Gerar pacote
        run: dotnet pack DanfeSharp/DanfeSharp.csproj -c Release --no-build -p:Version=${{ env.VERSAO }} -o nupkgs

      - name: Publicar no GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Criar Release com o pacote
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" nupkgs/*.nupkg --title "DanfeSharp.Next $VERSAO" --generate-notes
